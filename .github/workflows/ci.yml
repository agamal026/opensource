name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate public records
        run: python tools/oss_status.py validate
      - name: Verify generated status
        run: python tools/oss_status.py render --output progress/STATUS.md --check
      - name: Validate contribution campaign
        run: python tools/contribution_campaign.py validate
      - name: Verify generated campaign
        run: python tools/contribution_campaign.py report --output progress/CAMPAIGN.md --check
      - name: Check whitespace
        run: git diff --check
